services:
  - type: web
    name: basis
    runtime: node
    plan: free
    buildCommand: npm ci && npm run build
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: AI_API_KEY
        sync: false
      - key: AI_MODEL
        sync: false
      - key: STRIPE_SECRET_KEY
        sync: false
      - key: ADMIN_TOKEN
        generateValue: true
